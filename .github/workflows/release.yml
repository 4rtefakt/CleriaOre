# The player's download, CleriaOre-Setup-<version>.exe, built from a version tag (v1.2.3) on GitHub's own
# Windows runners as docs/STATUS.md builds it, signed through SignPath, and attached to a DRAFT GitHub release
# that a maintainer completes (notes) and publishes by hand.
#
# Signing (.signpath/README.md) runs once the repository has the SIGNPATH_API_TOKEN secret and the
# SIGNPATH_ORGANIZATION_ID variable; without them the exe is released unsigned, as before. A tag is signed with
# the release-signing policy (each request approved in SignPath), anything else with test-signing.
#   gh workflow run release.yml --ref <branch>     (build, and sign when configured, no release)
name: release

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml', '.signpath/**']
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # the signing request reads this run's details and its artifact

jobs:
  build:
    runs-on: windows-2022
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # The version is the one res/cleriaore.rc gives the exe; a tag must name that same version.
      - name: Version
        shell: bash
        run: |
          v=$(sed -n 's/.*VALUE "ProductVersion", "\(.*\)".*/\1/p' res/cleriaore.rc)
          [ -n "$v" ] || { echo "::error::no ProductVersion in res/cleriaore.rc"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$v" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but res/cleriaore.rc says $v"; exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Fetch dependencies
        run: python external/CleriaCore/tools/fetch_deps.py --only lua,miniz,fonts

      - name: Build
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A Win32
          cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage
        shell: bash
        run: mkdir unsigned && cp build/Release/CleriaOre.exe unsigned/

      - name: Upload unsigned
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: CleriaOre-unsigned
          path: unsigned/CleriaOre.exe
          if-no-files-found: error

      - name: Sign
        if: env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: CleriaOre
          signing-policy-slug: ${{ github.ref_type == 'tag' && 'release-signing' || 'test-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600   # a release waits for its approval in SignPath
          output-artifact-directory: signed
          parameters: |
            version: ${{ toJSON(env.VERSION) }}

      - name: Package
        shell: bash
        run: |
          mkdir dist
          src=unsigned/CleriaOre.exe
          if [ -f signed/CleriaOre.exe ]; then src=signed/CleriaOre.exe; else echo "::notice::not signed (SignPath not configured)"; fi
          cp "$src" "dist/CleriaOre-Setup-$VERSION.exe"
          (cd dist && sha256sum "CleriaOre-Setup-$VERSION.exe" > SHA256.txt && cat SHA256.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: CleriaOre
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CleriaOre
          path: dist
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exe=$(ls dist/CleriaOre-Setup-*.exe)
          sum=$(cut -d' ' -f1 dist/SHA256.txt)
          gh release create "$GITHUB_REF_NAME" "$exe" --repo "$GITHUB_REPOSITORY" --draft \
            --title "CleriaOre ${GITHUB_REF_NAME#v}" \
            --notes "Release notes to be written before publishing.

          SHA-256 of \`$(basename "$exe")\`: \`$sum\`

          [Code signing policy](https://github.com/4rtefakt/CleriaOre#code-signing-policy): free code signing provided by SignPath.io, certificate by SignPath Foundation."
